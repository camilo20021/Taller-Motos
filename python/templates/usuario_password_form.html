{% extends "base.html" %}
{% block titulo %}Cambiar contraseña · {{ config.APP_PRODUCTO }}{% endblock %}
{% block contenido %}

<div class="encabezado-pagina">
  <div>
    <h1>Cambiar contraseña</h1>
    <div class="subtexto">Cuenta de administrador: {{ usuario.nombre }}</div>
  </div>
</div>

<div class="tarjeta" style="max-width:420px;">
  <form method="POST">
    <div class="campo">
      <label for="password">Contraseña nueva *</label>
      <input type="password" id="password" name="password" required minlength="4" autofocus>
    </div>
    <div class="campo">
      <label for="password_confirmar">Confirmar contraseña *</label>
      <input type="password" id="password_confirmar" name="password_confirmar" required minlength="4">
    </div>

    <div class="acciones-form">
      <button type="submit" class="btn btn-primario">Guardar</button>
      <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secundario">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
